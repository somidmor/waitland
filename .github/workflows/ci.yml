name: Waitland CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: waitland-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            realtime/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install realtime dependencies
        run: npm --prefix realtime ci

      - name: Type-check web application
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run all tests
        run: npm test

      - name: Validate both Cloudflare bundles
        run: npm run cloudflare:check
